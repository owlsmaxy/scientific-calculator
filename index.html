<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131b">
    <meta name="description" content="A modern scientific calculator with history, memory, and keyboard support.">
    <title>Scientific Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/parser.js" defer></script>
    <script src="js/history.js" defer></script>
    <script src="js/calculator.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Scientific Calculator home">
          <span class="brand-mark" aria-hidden="true">∑</span>
          <span>calc<span class="brand-accent">ulus</span></span>
        </a>
        <div class="topbar-actions">
          <span class="mode-label" id="angle-label">DEG</span>
          <div class="appearance-control">
            <button class="icon-button" id="appearance-toggle" type="button" aria-label="Open appearance settings" aria-expanded="false" aria-controls="appearance-panel" title="Appearance settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42"/><circle cx="12" cy="12" r="4"/></svg>
            </button>
            <section class="appearance-panel" id="appearance-panel" aria-label="Appearance settings" hidden>
              <p class="appearance-title">Appearance</p>
              <div class="theme-options" role="group" aria-label="Color theme">
                <button class="theme-option" type="button" data-theme-mode="dark" aria-pressed="true"><span aria-hidden="true">◐</span> Dark</button>
                <button class="theme-option" type="button" data-theme-mode="light" aria-pressed="false"><span aria-hidden="true">☼</span> Light</button>
                <button class="theme-option" type="button" data-theme-mode="custom" aria-pressed="false"><span aria-hidden="true">✳</span> Custom</button>
              </div>
              <div class="custom-colors" id="custom-colors" hidden>
                <label class="color-setting" for="accent-color">Accent color<input id="accent-color" type="color" value="#9c8cff"></label>
                <label class="color-setting" for="background-color">Background<input id="background-color" type="color" value="#10131b"></label>
              </div>
            </section>
          </div>
        </div>
      </header>

      <section class="calculator-layout" aria-label="Scientific calculator">
        <section class="calculator-card">
          <div class="calculator-heading">
            <div>
              <p class="eyebrow">PRECISION, SIMPLIFIED</p>
              <h1>Scientific calculator</h1>
            </div>
            <button class="angle-toggle" id="angle-toggle" type="button" aria-label="Change angle mode">DEG <span aria-hidden="true">⌄</span></button>
          </div>

          <section class="display" aria-label="Calculator display">
            <div class="display-meta">
              <span id="previous-expression" aria-live="polite"></span>
              <button class="copy-button" id="copy-result" type="button" aria-label="Copy result" title="Copy result">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
              </button>
            </div>
            <input id="expression" class="expression" type="text" inputmode="none" autocomplete="off" spellcheck="false" aria-label="Expression" placeholder="0">
            <div id="result" class="result" aria-live="polite" aria-label="Result">0</div>
          </section>

          <div class="memory-row" aria-label="Memory functions">
            <button class="memory-key" data-action="memory-clear" type="button">MC</button>
            <button class="memory-key" data-action="memory-recall" type="button">MR</button>
            <button class="memory-key" data-action="memory-add" type="button">M+</button>
            <button class="memory-key" data-action="memory-subtract" type="button">M−</button>
            <button class="memory-indicator" id="memory-indicator" type="button" aria-label="Memory is empty" title="Memory status"><span></span> MEM</button>
          </div>

          <div class="keypad" aria-label="Calculator keys">
            <button class="key function-key" data-insert="sin(" type="button">sin</button>
            <button class="key function-key" data-insert="cos(" type="button">cos</button>
            <button class="key function-key" data-insert="tan(" type="button">tan</button>
            <button class="key function-key" data-insert="asin(" type="button">sin<sup>−1</sup></button>
            <button class="key function-key" data-insert="acos(" type="button">cos<sup>−1</sup></button>
            <button class="key function-key" data-insert="atan(" type="button">tan<sup>−1</sup></button>

            <button class="key function-key" data-insert="sinh(" type="button">sinh</button>
            <button class="key function-key" data-insert="cosh(" type="button">cosh</button>
            <button class="key function-key" data-insert="tanh(" type="button">tanh</button>
            <button class="key function-key" data-insert="log(" type="button">log</button>
            <button class="key function-key" data-insert="ln(" type="button">ln</button>
            <button class="key function-key" data-insert="sqrt(" type="button">√</button>

            <button class="key function-key" data-insert="cbrt(" type="button">∛</button>
            <button class="key function-key" data-insert="abs(" type="button">|x|</button>
            <button class="key function-key" data-insert="^" type="button">x<sup>y</sup></button>
            <button class="key function-key" data-insert="!" type="button">x!</button>
            <button class="key function-key" data-insert="%" type="button">%</button>
            <button class="key function-key" data-insert="(" type="button">(</button>

            <button class="key function-key" data-insert=")" type="button">)</button>
            <button class="key function-key" data-insert="pi" type="button">π</button>
            <button class="key function-key" data-insert="e" type="button">e</button>
            <button class="key function-key" data-insert="Ans" type="button">Ans</button>
            <button class="key utility-key" data-action="delete" type="button" aria-label="Delete last character" title="Delete">⌫</button>
            <button class="key utility-key" data-action="clear" type="button">AC</button>

            <button class="key number-key" data-insert="7" type="button">7</button>
            <button class="key number-key" data-insert="8" type="button">8</button>
            <button class="key number-key" data-insert="9" type="button">9</button>
            <button class="key operator-key" data-insert="/" type="button">÷</button>
            <button class="key operator-key" data-insert="*" type="button">×</button>
            <button class="key operator-key" data-insert="-" type="button">−</button>

            <button class="key number-key" data-insert="4" type="button">4</button>
            <button class="key number-key" data-insert="5" type="button">5</button>
            <button class="key number-key" data-insert="6" type="button">6</button>
            <button class="key operator-key" data-insert="+" type="button">+</button>
            <button class="key number-key" data-insert="1" type="button">1</button>
            <button class="key number-key" data-insert="2" type="button">2</button>

            <button class="key number-key" data-insert="3" type="button">3</button>
            <button class="key number-key" data-insert="0" type="button">0</button>
            <button class="key number-key" data-insert="." type="button">.</button>
            <button class="key operator-key" data-insert="E" type="button" title="Scientific notation exponent">EXP</button>
            <button class="key number-key" data-insert="00" type="button">00</button>
            <button class="key equals-key" data-action="equals" type="button" aria-label="Calculate">=</button>
          </div>
          <p class="keyboard-hint">Tip: use your keyboard <kbd>Enter</kbd> to calculate <span>·</span> <kbd>Esc</kbd> to clear</p>
        </section>

        <aside class="history-card" aria-label="Calculation history">
          <div class="history-heading">
            <div><p class="eyebrow">YOUR WORKSPACE</p><h2>History</h2></div>
            <button class="clear-history" id="clear-history" type="button">Clear all</button>
          </div>
          <div id="history-list" class="history-list">
            <div class="history-empty"><span class="history-icon" aria-hidden="true">↺</span><p>Your calculations will<br>appear here.</p></div>
          </div>
          <div class="history-footer"><span class="status-dot"></span> Ready when you are</div>
        </aside>
      </section>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
